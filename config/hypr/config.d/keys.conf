
###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

bind = $mainMod SHIFT, delete, exec, hyprlock
bind = $mainMod CTRL SHIFT, delete, exec, wlogout

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, return, exec, $terminal
bind = $mainMod SHIFT, C, hy3:killactive,
bind = $mainMod SHIFT, q, exit,
bind = $mainMod, a, exec, $fileManager
bind = $mainMod, f, fullscreen
bind = $mainMod SHIFT, space, togglefloating,
bind = $mainMod shift, R, exec, $execmenu
bind = $mainMod, R, exec, $menu
# bind = $mainMod, P, pseudo, # dwindle
# bind = $mainMod, v, togglesplit, # dwindle

bind = $mainMod CTRL, w, hy3:changegroup, tab, force_ephemeral
bind = $mainMod, v, hy3:makegroup, v
bind = $mainMod, b, hy3:makegroup, h
bind = $mainMod, u, hy3:changegroup, opposite

bind = $mainMod CTRL, a, hy3:changefocus, raise
bind = $mainMod CTRL, x, hy3:changefocus, lower

# Move focus
# bind = $mainMod, right, workspace, +1
# bind = $mainMod, left, workspace, -1
# bind = $mainMod, o, movewindow, mon:+1
# bind = $mainMod SHIFT, o, movecurrentworkspacetomonitor, +1

bind = $mainMod CTRL, l, focusmonitor, DP-2
bind = $mainMod CTRL, h, focusmonitor, DP-1
bind = $mainMod, escape, workspace, previous
bind = $mainMod, h, hy3:movefocus, l
bind = $mainMod, l, hy3:movefocus, r
bind = $mainMod, k, hy3:movefocus, u
bind = $mainMod, j, hy3:movefocus, d
bind = $mainMod SHIFT, h, hy3:movewindow, l
bind = $mainMod SHIFT, l, hy3:movewindow, r
bind = $mainMod SHIFT, k, hy3:movewindow, u
bind = $mainMod SHIFT, j, hy3:movewindow, d

# https://github.com/Duckonaut/split-monitor-workspaces
bind = $mainMod, 1, split-workspace, 1
bind = $mainMod, 2, split-workspace, 2
bind = $mainMod, 3, split-workspace, 3
bind = $mainMod, 4, split-workspace, 4
bind = $mainMod, 5, split-workspace, 5
bind = $mainMod, 6, split-workspace, 6
bind = $mainMod, 7, split-workspace, 7
bind = $mainMod, 8, split-workspace, 8
bind = $mainMod, 9, split-workspace, 9
bind = $mainMod, 0, split-workspace, 10

# Switch workspaces with mainMod + [0-9]
# bind = $mainMod, 1, workspace, 1
# bind = $mainMod, 2, workspace, 2
# bind = $mainMod, 3, workspace, 3
# bind = $mainMod, 4, workspace, 4
# bind = $mainMod, 5, workspace, 5
# bind = $mainMod, 6, workspace, 6
# bind = $mainMod, 7, workspace, 7
# bind = $mainMod, 8, workspace, 8
# bind = $mainMod, 9, workspace, 9
# bind = $mainMod, 0, workspace, 10

# Par moniteur
# https://github.com/Duckonaut/split-monitor-workspaces
bind = $mainMod, right, exec, hypr-cycle-workspace next
bind = $mainMod, left, exec, hypr-cycle-workspace prev
bind = $mainMod, o, split-changemonitor, next

binde = $mainMod SHIFT, right, resizeactive, 80 0
binde = $mainMod SHIFT, left, resizeactive, -80 0
binde = $mainMod SHIFT, up, resizeactive, 0 -80
binde = $mainMod SHIFT, down, resizeactive, 0 80

# https://github.com/Duckonaut/split-monitor-workspaces
bind = $mainMod SHIFT, 1, split-movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, split-movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, split-movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, split-movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, split-movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, split-movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, split-movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, split-movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, split-movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, split-movetoworkspacesilent, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
# bind = $mainMod SHIFT, 1, hy3:movetoworkspace, 1
# bind = $mainMod SHIFT, 2, hy3:movetoworkspace, 2
# bind = $mainMod SHIFT, 3, hy3:movetoworkspace, 3
# bind = $mainMod SHIFT, 4, hy3:movetoworkspace, 4
# bind = $mainMod SHIFT, 5, hy3:movetoworkspace, 5
# bind = $mainMod SHIFT, 6, hy3:movetoworkspace, 6
# bind = $mainMod SHIFT, 7, hy3:movetoworkspace, 7
# bind = $mainMod SHIFT, 8, hy3:movetoworkspace, 8
# bind = $mainMod SHIFT, 9, hy3:movetoworkspace, 9
# bind = $mainMod SHIFT, 0, hy3:movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, minus, togglespecialworkspace, magic
bind = $mainMod SHIFT, minus, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

bind = $mainMod Shift, p, exec, mpc toggle
bind = $mainMod MOD5, period, exec, mpc next
bind = $mainMod MOD5, comma, exec, mpc prev
bind = $mainMod, F4, exec, ~/bin/mpd-toggle-local
bind = $mainMod Shift, period, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bind = $mainMod Shift, comma, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = $mainMod Shift, m, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Applications

bind = $mainMod, e, exec, $terminal -e bash -c 'sleep 0.05; vim'
bind = $mainMod CTRL, d, exec, $terminal -e pulsemixer
bind = $mainMod, d, exec, $terminal -e ncmpcpp
bind = $mainMod SHIFT, d, exec, hypr-layout --terminal $terminal 't(h(v(30%:{pulsemixer}, {ncmpcpp -s playlist}), v({ncmpcpp -s media_library}, {ncmpcpp -s search_engine})), easyeffects, qpwgraph)'
bind = $mainMod, z, exec, qutebrowser
bind = $mainMod, i, exec, $terminal -e neomutt

bind = $mainMod SHIFT, t, exec, hypr-layout --terminal $terminal 'h({btop}, 25%:{nvtop})'

bind = $mainMod SHIFT, s, exec, pkill gammastep || gammastep -O 2800
bind = $mainMod SHIFT, z, exec, chromium
bind = $mainMod CTRL SHIFT, p, exec, passmenu

# Profils EasyEffects
bind = $mainMod, F7, exec, easyeffects -l audiotechnica-roland
bind = $mainMod, F8, exec, easyeffects -l robot
bind = $mainMod, F9, exec, easyeffects -l rose

# Gray Zone Warfare — jeter des items
bind = $mainMod, q, exec, ydotool key 111:1 111:0

# Bascule audio
# Casque (carte mère) et micros (Roland) filaires
bind = $mainMod, F9, exec, pactl set-default-source alsa_input.usb-Roland_Rubix22-00.analog-stereo && pactl set-default-sink alsa_output.pci-0000_0c_00.4.analog-stereo
# Casque et micros sans-fil (Arctis Nova 3P)
bind = $mainMod, F10, exec, pactl set-default-source alsa_input.usb-SteelSeries_Arctis_Nova_3P_Wireless-00.mono-fallback && pactl set-default-sink alsa_output.usb-SteelSeries_Arctis_Nova_3P_Wireless-00.analog-stereo
bind = $mainMod, F11, exec, pactl set-default-source alsa_input.usb-Roland_Rubix22-00.analog-stereo

# Verrouiller et suspendre
bind = $mainMod, F3, exec, hyprlock & systemctl suspend

# Focus mode toggle (tuilé ↔ flottant)
bind = $mainMod, space, exec, ~/bin/hypr-focus-mode-toggle

# Commutateur de fenêtres (remplace swayr)
bind = $mainMod, F1, exec, ~/bin/hypr-window-switcher
# Captures d'écran
bind = , Print, exec, grim -g "$(slurp)" - | swappy -f -
bind = CTRL, Print, exec, grim -g "$(slurp)" - | wl-copy
bind = SHIFT, Print, exec, grim
bind = CTRL SHIFT, Print, exec, bash -c 'sleep 5 ; grim'

